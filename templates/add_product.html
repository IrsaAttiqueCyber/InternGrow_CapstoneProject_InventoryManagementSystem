{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Add New Product</h2>

    <form method="POST">

        <label>Product Name</label>
        <input
            type="text"
            name="name"
            placeholder="Enter product name"
            required
        >

        <label>Category</label>
        <input
            type="text"
            name="category"
            placeholder="Enter category"
            required
        >

        <label>Quantity</label>
        <input
            type="number"
            name="quantity"
            min="0"
            placeholder="Enter quantity"
            required
        >

        <label>Price</label>
        <input
            type="number"
            name="price"
            min="0"
            step="0.01"
            placeholder="Enter price"
            required
        >

        <button type="submit">
            Add Product
        </button>

    </form>

    <p>
        <a href="{{ url_for('main.products') }}">
            Back to Products
        </a>
    </p>

</div>

{% endblock %}
