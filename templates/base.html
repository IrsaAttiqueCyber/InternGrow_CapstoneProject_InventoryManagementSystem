<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        nav {
            background-color: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #eee;
        }

        .message {
            padding: 10px;
            background-color: #fff3cd;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .actions a {
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <nav>

        <a href="{{ url_for('main.home') }}">
            Inventory System
        </a>

        {% if current_user.is_authenticated %}

            <a href="{{ url_for('main.dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('main.products') }}">
                Products
            </a>

            <a href="{{ url_for('main.add_product') }}">
                Add Product
            </a>

            <a href="{{ url_for('main.export_csv') }}">
                Export CSV
            </a>

            <a href="{{ url_for('main.logout') }}">
                Logout
            </a>

        {% endif %}

    </nav>

    <div class="container">

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        {% block content %}

        {% endblock %}

    </div>

</body>
</html>
