{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Edit Product</h2>

    <form method="POST">

        <label>Product Name</label>
        <input
            type="text"
            name="name"
            value="{{ product.name }}"
            required
        >

        <label>Category</label>
        <input
            type="text"
            name="category"
            value="{{ product.category }}"
            required
        >

        <label>Quantity</label>
        <input
            type="number"
            name="quantity"
            value="{{ product.quantity }}"
            min="0"
            required
        >

        <label>Price</label>
        <input
            type="number"
            name="price"
            value="{{ product.price }}"
            min="0"
            step="0.01"
            required
        >

        <button type="submit">
            Update Product
        </button>

    </form>

    <p>
        <a href="{{ url_for('main.products') }}">
            Back to Products
        </a>
    </p>

</div>

{% endblock %}
